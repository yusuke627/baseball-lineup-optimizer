[project]
name = "baseball-lineup-optimizer"
version = "0.1.0"
description = "MLBデータに基づく打順別得点期待値の算出・最適化API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# select を明記し、ruff のバージョンによって既定ルールが変わっても結果がぶれないようにする。
# 行の長さ(E501)は日本語のコメント・docstringが多いため対象外。
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
