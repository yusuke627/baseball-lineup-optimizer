name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      # フロントエンドのテストが読み込む検証の例 (schemas/) と選手データ (data/presets/)
      - "schemas/**"
      - "data/presets/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "schemas/**"
      - "data/presets/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

# 同じブランチ (同じ ref) で新しい実行が始まったら、古い実行を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # 手元と同じ版 (frontend/.nvmrc。24.19.0)
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      # npm run test は "vitest run" (ウォッチにならず、1回だけ実行する)
      - name: Test (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      - name: Contrast (WCAG の色の組み合わせ)
        run: npm run contrast
